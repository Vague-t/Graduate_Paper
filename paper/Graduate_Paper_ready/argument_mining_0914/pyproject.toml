[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argument-mining-0914"
version = "0.1.0"
description = "New, auditable reference implementation for the 0914 argument mining thesis"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ml = ["torch==2.8.0", "transformers==4.57.6", "safetensors==0.7.0"]

[project.scripts]
am0914 = "am.cli:main"

[tool.setuptools.packages.find]
include = ["am*"]
