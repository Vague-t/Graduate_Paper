<svg xmlns="http://www.w3.org/2000/svg" width="157mm" height="98.0722mm" viewBox="0 0 445.0393700787402 278" role="img">
<title>argument_example</title><desc>同一人为构造片段的原文、组件及有向关系；NONE 表示不输出边。</desc>
<g font-family="Arial Unicode MS, Noto Sans CJK SC, Songti SC, sans-serif">
<rect width="445.0393700787402" height="278" fill="white"/>
<rect x="12" y="8" width="421.0393700787402" height="80" rx="3" fill="rgb(247,247,247)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="23.000" y="24.000" font-size="10" text-anchor="start" fill="rgb(15,15,15)" textLength="80.000" lengthAdjust="spacingAndGlyphs">原文（人为构造）</text>
<text x="23.000" y="40.000" font-size="9.3" text-anchor="start" fill="rgb(15,15,15)" textLength="111.600" lengthAdjust="spacingAndGlyphs">学校应该增加图书馆经费。</text>
<text x="23.000" y="53.000" font-size="9.3" text-anchor="start" fill="rgb(15,15,15)" textLength="176.700" lengthAdjust="spacingAndGlyphs">图书馆现有座位不足，而且开放时间偏短。</text>
<text x="23.000" y="66.000" font-size="9.3" text-anchor="start" fill="rgb(15,15,15)" textLength="213.900" lengthAdjust="spacingAndGlyphs">图书馆应该延长开放时间。食堂应该增加素食窗口。</text>
<polyline points="222.520,88.000 222.520,104.000" fill="none" stroke="rgb(31,31,31)" stroke-width="1"/>
<polygon points="222.520,104.000 220.611,100.036 224.429,100.036" fill="rgb(31,31,31)"/>
<rect x="12" y="106" width="246" height="148" rx="3" fill="rgb(255,255,255)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="24.000" y="122.000" font-size="10" text-anchor="start" fill="rgb(15,15,15)" textLength="120.000" lengthAdjust="spacingAndGlyphs">组件识别：完整跨度＋类型</text>
<text x="23.000" y="142.000" font-size="9.2" text-anchor="start" fill="rgb(15,15,15)" textLength="151.297" lengthAdjust="spacingAndGlyphs">c1 · Claim：学校应该增加图书馆经费</text>
<text x="23.000" y="163.000" font-size="9.2" text-anchor="start" fill="rgb(15,15,15)" textLength="152.326" lengthAdjust="spacingAndGlyphs">c2 · Premise：图书馆现有座位不足，</text>
<text x="23.000" y="184.000" font-size="9.2" text-anchor="start" fill="rgb(15,15,15)" textLength="124.721" lengthAdjust="spacingAndGlyphs">                    而且开放时间偏短</text>
<text x="23.000" y="205.000" font-size="9.2" text-anchor="start" fill="rgb(15,15,15)" textLength="151.297" lengthAdjust="spacingAndGlyphs">c3 · Claim：图书馆应该延长开放时间</text>
<text x="23.000" y="226.000" font-size="9.2" text-anchor="start" fill="rgb(15,15,15)" textLength="142.097" lengthAdjust="spacingAndGlyphs">c4 · Claim：食堂应该增加素食窗口</text>
<rect x="270" y="106" width="163" height="148" rx="3" fill="rgb(255,255,255)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="351.500" y="122.000" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="110.400" lengthAdjust="spacingAndGlyphs">关系识别：完整组件为端点</text>
<rect x="281" y="164" width="32" height="23" rx="3" fill="rgb(255,255,255)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="297.000" y="179.125" font-size="9.3" text-anchor="middle" fill="rgb(15,15,15)" textLength="9.822" lengthAdjust="spacingAndGlyphs">c2</text>
<rect x="390" y="133" width="32" height="23" rx="3" fill="rgb(255,255,255)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="406.000" y="148.125" font-size="9.3" text-anchor="middle" fill="rgb(15,15,15)" textLength="9.822" lengthAdjust="spacingAndGlyphs">c1</text>
<rect x="390" y="195" width="32" height="23" rx="3" fill="rgb(255,255,255)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="406.000" y="210.125" font-size="9.3" text-anchor="middle" fill="rgb(15,15,15)" textLength="9.822" lengthAdjust="spacingAndGlyphs">c3</text>
<polyline points="313.000,171.000 348.000,144.500 390.000,144.500" fill="none" stroke="rgb(31,31,31)" stroke-width="1"/>
<polygon points="390.000,144.500 386.036,146.409 386.036,142.591" fill="rgb(31,31,31)"/>
<polyline points="313.000,180.000 348.000,206.500 390.000,206.500" fill="none" stroke="rgb(31,31,31)" stroke-width="1"/>
<polygon points="390.000,206.500 386.036,208.409 386.036,204.591" fill="rgb(31,31,31)"/>
<text x="350.000" y="137.000" font-size="9" text-anchor="middle" fill="rgb(15,15,15)" textLength="31.522" lengthAdjust="spacingAndGlyphs">Support</text>
<text x="350.000" y="220.000" font-size="9" text-anchor="middle" fill="rgb(15,15,15)" textLength="31.522" lengthAdjust="spacingAndGlyphs">Support</text>
<rect x="281" y="219" width="32" height="23" rx="3" fill="rgb(255,255,255)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="297.000" y="234.125" font-size="9.3" text-anchor="middle" fill="rgb(15,15,15)" textLength="9.822" lengthAdjust="spacingAndGlyphs">c4</text>
<text x="371.000" y="241.000" font-size="9" text-anchor="middle" fill="rgb(15,15,15)" textLength="87.429" lengthAdjust="spacingAndGlyphs">c2→c4：NONE，无边</text>
<text x="222.520" y="271.000" font-size="9" text-anchor="middle" fill="rgb(76,76,76)" textLength="135.000" lengthAdjust="spacingAndGlyphs">人为构造的机制示意；非实测结果</text>
</g></svg>
