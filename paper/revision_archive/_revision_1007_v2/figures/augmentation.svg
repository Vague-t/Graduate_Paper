<svg xmlns="http://www.w3.org/2000/svg" width="157mm" height="115.0056mm" viewBox="0 0 445.0393700787402 326" role="img">
<title>augmentation</title><desc>选定组件的关系影响域包含内部与跨边界的全部合法端点组合，包括 NONE。</desc>
<g font-family="Arial Unicode MS, Noto Sans CJK SC, Songti SC, sans-serif">
<rect width="445.0393700787402" height="326" fill="white"/>
<text x="17.000" y="19.000" font-size="10.1" text-anchor="start" fill="rgb(15,15,15)" textLength="197.828" lengthAdjust="spacingAndGlyphs">只改写 A={c1,c2}；检查全部受影响关系因素</text>
<rect x="17" y="33" width="199" height="185" rx="3" fill="rgb(245,245,245)" stroke="rgb(56,56,56)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="116.500" y="51.000" font-size="9.8" text-anchor="middle" fill="rgb(15,15,15)" textLength="49.000" lengthAdjust="spacingAndGlyphs">可改写组件</text>
<text x="340.000" y="51.000" font-size="9.8" text-anchor="middle" fill="rgb(15,15,15)" textLength="39.200" lengthAdjust="spacingAndGlyphs">只读组件</text>
<rect x="31" y="64" width="171" height="41" rx="3" fill="rgb(255,255,255)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="116.500" y="81.875" font-size="9.3" text-anchor="middle" fill="rgb(15,15,15)" textLength="41.341" lengthAdjust="spacingAndGlyphs">c1 · Claim</text>
<text x="116.500" y="94.375" font-size="9.3" text-anchor="middle" fill="rgb(15,15,15)" textLength="102.300" lengthAdjust="spacingAndGlyphs">学校应该增加图书馆经费</text>
<rect x="31" y="155" width="171" height="49" rx="3" fill="rgb(255,255,255)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="116.500" y="170.625" font-size="9.3" text-anchor="middle" fill="rgb(15,15,15)" textLength="51.681" lengthAdjust="spacingAndGlyphs">c2 · Premise</text>
<text x="116.500" y="183.125" font-size="9.3" text-anchor="middle" fill="rgb(15,15,15)" textLength="93.000" lengthAdjust="spacingAndGlyphs">图书馆现有座位不足，</text>
<text x="116.500" y="195.625" font-size="9.3" text-anchor="middle" fill="rgb(15,15,15)" textLength="74.400" lengthAdjust="spacingAndGlyphs">而且开放时间偏短</text>
<rect x="260" y="64" width="169" height="41" rx="3" fill="rgb(255,255,255)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="344.500" y="81.875" font-size="9.3" text-anchor="middle" fill="rgb(15,15,15)" textLength="41.341" lengthAdjust="spacingAndGlyphs">c3 · Claim</text>
<text x="344.500" y="94.375" font-size="9.3" text-anchor="middle" fill="rgb(15,15,15)" textLength="102.300" lengthAdjust="spacingAndGlyphs">图书馆应该延长开放时间</text>
<rect x="260" y="177" width="169" height="35" rx="3" fill="rgb(255,255,255)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="344.500" y="191.875" font-size="9.3" text-anchor="middle" fill="rgb(15,15,15)" textLength="41.341" lengthAdjust="spacingAndGlyphs">c4 · Claim</text>
<text x="344.500" y="204.375" font-size="9.3" text-anchor="middle" fill="rgb(15,15,15)" textLength="93.000" lengthAdjust="spacingAndGlyphs">食堂应该增加素食窗口</text>
<polyline points="63.000,155.000 63.000,105.000" fill="none" stroke="rgb(31,31,31)" stroke-width="1.25"/>
<polygon points="63.000,105.000 64.909,108.964 61.091,108.964" fill="rgb(31,31,31)"/>
<text x="135.000" y="133.000" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="53.179" lengthAdjust="spacingAndGlyphs">内部 Support</text>
<polyline points="202.000,176.000 237.000,176.000 237.000,84.500 260.000,84.500" fill="none" stroke="rgb(31,31,31)" stroke-width="1.25"/>
<polygon points="260.000,84.500 256.036,86.409 256.036,82.591" fill="rgb(31,31,31)"/>
<text x="340.000" y="127.000" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="62.379" lengthAdjust="spacingAndGlyphs">跨边界 Support</text>
<text x="340.000" y="149.000" font-size="9.1" text-anchor="middle" fill="rgb(15,15,15)" textLength="80.309" lengthAdjust="spacingAndGlyphs">c2→c4：跨边界组合</text>
<text x="340.000" y="161.000" font-size="9.1" text-anchor="middle" fill="rgb(15,15,15)" textLength="71.791" lengthAdjust="spacingAndGlyphs">NONE，不输出边</text>
<text x="222.520" y="235.000" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="232.048" lengthAdjust="spacingAndGlyphs">影响域：所有与 A 相交的合法端点组合；图中仅列举部分</text>
<rect x="17" y="246" width="117" height="39" rx="3" fill="rgb(240,240,240)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="75.500" y="262.875" font-size="9.3" text-anchor="middle" fill="rgb(15,15,15)" textLength="55.800" lengthAdjust="spacingAndGlyphs">指定槽位改写</text>
<text x="75.500" y="275.375" font-size="9.3" text-anchor="middle" fill="rgb(15,15,15)" textLength="55.800" lengthAdjust="spacingAndGlyphs">保留其余文本</text>
<rect x="164" y="246" width="117" height="39" rx="3" fill="rgb(255,255,255)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="222.500" y="262.875" font-size="9.3" text-anchor="middle" fill="rgb(15,15,15)" textLength="74.400" lengthAdjust="spacingAndGlyphs">全文回填与重分词</text>
<text x="222.500" y="275.375" font-size="9.3" text-anchor="middle" fill="rgb(15,15,15)" textLength="83.700" lengthAdjust="spacingAndGlyphs">全部坐标／端点输运</text>
<rect x="311" y="246" width="117" height="39" rx="3" fill="rgb(255,255,255)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="369.500" y="262.875" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="82.800" lengthAdjust="spacingAndGlyphs">逐项核对完整影响域</text>
<text x="369.500" y="275.375" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="82.800" lengthAdjust="spacingAndGlyphs">任一标签漂移则拒绝</text>
<polyline points="134.000,265.500 164.000,265.500" fill="none" stroke="rgb(31,31,31)" stroke-width="1"/>
<polygon points="164.000,265.500 160.036,267.409 160.036,263.591" fill="rgb(31,31,31)"/>
<polyline points="281.000,265.500 311.000,265.500" fill="none" stroke="rgb(31,31,31)" stroke-width="1"/>
<polygon points="311.000,265.500 307.036,267.409 307.036,263.591" fill="rgb(31,31,31)"/>
<text x="222.520" y="305.000" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="249.936" lengthAdjust="spacingAndGlyphs">只读组件也可能位移；内部／跨边界与有边／NONE 分开核对</text>
<text x="222.520" y="319.000" font-size="9" text-anchor="middle" fill="rgb(76,76,76)" textLength="135.000" lengthAdjust="spacingAndGlyphs">人为构造的机制示意；非实测结果</text>
</g></svg>
