<svg xmlns="http://www.w3.org/2000/svg" width="157mm" height="129.8222mm" viewBox="0 0 445.0393700787402 368" role="img">
<title>bounded_execution</title><desc>冻结候选和对象评分后，在有限预算内构造、求解、核验和提交依赖闭合事务。</desc>
<g font-family="Arial Unicode MS, Noto Sans CJK SC, Songti SC, sans-serif">
<rect width="445.0393700787402" height="368" fill="white"/>
<rect x="15" y="8" width="414" height="30" rx="3" fill="rgb(255,255,255)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="222.000" y="26.625" font-size="9.3" text-anchor="middle" fill="rgb(15,15,15)" textLength="250.333" lengthAdjust="spacingAndGlyphs">测试原文 → K 个完整候选 → MCR 与共享合法化 → 当前图 G0</text>
<polyline points="222.000,38.000 222.000,49.000" fill="none" stroke="rgb(31,31,31)" stroke-width="1"/>
<polygon points="222.000,49.000 220.091,45.036 223.909,45.036" fill="rgb(31,31,31)"/>
<rect x="15" y="49" width="414" height="34" rx="3" fill="rgb(242,242,242)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="222.000" y="63.375" font-size="9.1" text-anchor="middle" fill="rgb(15,15,15)" textLength="246.220" lengthAdjust="spacingAndGlyphs">搜索前冻结：候选宇宙 U/P、对象评分 q_C/q_R、成本与阈值</text>
<text x="222.000" y="75.875" font-size="9.1" text-anchor="middle" fill="rgb(15,15,15)" textLength="197.672" lengthAdjust="spacingAndGlyphs">评分器独立 OOF 拟合并离线校准；非训练辅助头</text>
<polyline points="222.000,83.000 222.000,97.000" fill="none" stroke="rgb(31,31,31)" stroke-width="1"/>
<polygon points="222.000,97.000 220.091,93.036 223.909,93.036" fill="rgb(31,31,31)"/>
<rect x="34" y="97" width="264" height="34" rx="3" fill="rgb(237,237,237)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="166.000" y="111.375" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="118.077" lengthAdjust="spacingAndGlyphs">有限提案队列：D0、B、S_R</text>
<text x="166.000" y="123.875" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="174.800" lengthAdjust="spacingAndGlyphs">记录试探；检查剩余尝试／时间／编辑预算</text>
<rect x="323" y="97" width="106" height="34" rx="3" fill="rgb(255,255,255)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="376.000" y="111.375" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="44.486" lengthAdjust="spacingAndGlyphs">独立 no-op</text>
<text x="376.000" y="123.875" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="64.400" lengthAdjust="spacingAndGlyphs">保留当前合法图</text>
<polyline points="376.000,83.000 376.000,97.000" fill="none" stroke="rgb(31,31,31)" stroke-width="1" stroke-dasharray="3 2"/>
<polygon points="376.000,97.000 374.091,93.036 377.909,93.036" fill="rgb(31,31,31)"/>
<polyline points="166.000,131.000 166.000,143.000" fill="none" stroke="rgb(31,31,31)" stroke-width="1"/>
<polygon points="166.000,143.000 164.091,139.036 167.909,139.036" fill="rgb(31,31,31)"/>
<rect x="34" y="143" width="395" height="34" rx="3" fill="rgb(237,237,237)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="231.500" y="157.375" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="190.985" lengthAdjust="spacingAndGlyphs">抵消相同对象 → 组件冲突闭包 → 新组件集合 C′</text>
<text x="231.500" y="169.875" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="206.492" lengthAdjust="spacingAndGlyphs">闭合全部入／出与 NONE 关系空间；外部关系固定</text>
<polyline points="231.500,177.000 231.500,189.000" fill="none" stroke="rgb(31,31,31)" stroke-width="1"/>
<polygon points="231.500,189.000 229.591,185.036 233.409,185.036" fill="rgb(31,31,31)"/>
<rect x="34" y="189" width="395" height="34" rx="3" fill="rgb(237,237,237)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="231.500" y="203.375" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="221.236" lengthAdjust="spacingAndGlyphs">局部 ILP → 复核可行候选：整图合法、两分项效用不降</text>
<text x="231.500" y="215.875" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="166.885" lengthAdjust="spacingAndGlyphs">总效用增益 &gt; 正阈值，且不超过剩余预算</text>
<text x="231.500" y="239.000" font-size="9.0" text-anchor="middle" fill="rgb(15,15,15)" textLength="251.517" lengthAdjust="spacingAndGlyphs">超时有可行解：复核后可用并记录 gap；无可行解：拒绝该试探</text>
<rect x="34" y="253" width="237" height="35" rx="3" fill="rgb(230,230,230)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="152.500" y="267.875" font-size="9.1" text-anchor="middle" fill="rgb(15,15,15)" textLength="168.688" lengthAdjust="spacingAndGlyphs">合格者择优：总效用 → 更少编辑 → 语义键</text>
<text x="152.500" y="280.375" font-size="9.1" text-anchor="middle" fill="rgb(15,15,15)" textLength="145.600" lengthAdjust="spacingAndGlyphs">组件与关系原子提交；重建提案队列</text>
<rect x="304" y="253" width="125" height="35" rx="3" fill="rgb(255,255,255)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="366.500" y="267.875" font-size="9.1" text-anchor="middle" fill="rgb(15,15,15)" textLength="77.874" lengthAdjust="spacingAndGlyphs">无合格事务／no-op</text>
<text x="366.500" y="280.375" font-size="9.1" text-anchor="middle" fill="rgb(15,15,15)" textLength="72.800" lengthAdjust="spacingAndGlyphs">或预算耗尽：停止</text>
