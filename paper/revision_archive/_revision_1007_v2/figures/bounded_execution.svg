<polygon points="50.000,253.000 48.091,249.036 51.909,249.036" fill="rgb(31,31,31)"/>
<polyline points="361.000,223.000 361.000,229.000 441.000,229.000" fill="none" stroke="rgb(38,38,38)" stroke-width="1" stroke-dasharray="3 2"/>
