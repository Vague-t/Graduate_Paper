<polygon points="366.500,253.000 364.591,249.036 368.409,249.036" fill="rgb(31,31,31)"/>
<polyline points="34.000,270.500 20.000,270.500 20.000,114.000 34.000,114.000" fill="none" stroke="rgb(31,31,31)" stroke-width="1" stroke-dasharray="3 2"/>
<polygon points="34.000,114.000 30.036,115.909 30.036,112.091" fill="rgb(31,31,31)"/>
<text x="17.000" y="312.000" font-size="9.2" text-anchor="start" fill="rgb(15,15,15)" textLength="220.800" lengthAdjust="spacingAndGlyphs">循环只更新当前图与提案；评分、阈值及原文始终不变</text>
<rect x="304" y="300" width="125" height="26" rx="3" fill="rgb(255,255,255)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="366.500" y="316.625" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="82.800" lengthAdjust="spacingAndGlyphs">输出当前完整合法图</text>
<polyline points="366.500,288.000 366.500,300.000" fill="none" stroke="rgb(31,31,31)" stroke-width="1"/>
<polygon points="366.500,300.000 364.591,296.036 368.409,296.036" fill="rgb(31,31,31)"/>
<polyline points="17.000,344.000 42.000,344.000" fill="none" stroke="rgb(31,31,31)" stroke-width="1"/>
<polygon points="42.000,344.000 38.036,345.909 38.036,342.091" fill="rgb(31,31,31)"/>
<text x="49.000" y="347.000" font-size="9" text-anchor="start" fill="rgb(15,15,15)" textLength="45.000" lengthAdjust="spacingAndGlyphs">数据／表示</text>
<polyline points="118.000,344.000 143.000,344.000" fill="none" stroke="rgb(31,31,31)" stroke-width="1" stroke-dasharray="3 2"/>
<polygon points="143.000,344.000 139.036,345.909 139.036,342.091" fill="rgb(31,31,31)"/>
<text x="150.000" y="347.000" font-size="9" text-anchor="start" fill="rgb(15,15,15)" textLength="45.000" lengthAdjust="spacingAndGlyphs">控制／调用</text>
<text x="429.039" y="347.000" font-size="9" text-anchor="end" fill="rgb(15,15,15)" textLength="63.000" lengthAdjust="spacingAndGlyphs">灰底：新增模块</text>
<text x="222.520" y="361.000" font-size="9" text-anchor="middle" fill="rgb(76,76,76)" textLength="135.000" lengthAdjust="spacingAndGlyphs">人为构造的机制示意；非实测结果</text>
</g></svg>
