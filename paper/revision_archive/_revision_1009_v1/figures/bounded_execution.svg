<svg xmlns="http://www.w3.org/2000/svg" width="157mm" height="134.7611mm" viewBox="0 0 445.0393700787402 382" role="img">
<title>bounded_execution</title><desc>固定候选与评分下，六类队列分批评估并整批择优；空批保留no-op并继续余批。</desc>
<g font-family="Arial Unicode MS, Noto Sans CJK SC, Songti SC, sans-serif">
<rect width="445.0393700787402" height="382" fill="white"/>
<rect x="15" y="8" width="414" height="30" rx="3" fill="rgb(255,255,255)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="222.000" y="26.625" font-size="9.3" text-anchor="middle" fill="rgb(15,15,15)" textLength="216.743" lengthAdjust="spacingAndGlyphs">原文 → K 个候选 → MCR 与共用合法化 → 初始合法图</text>
<polyline points="222.000,38.000 222.000,49.000" fill="none" stroke="rgb(31,31,31)" stroke-width="1"/>
<polygon points="222.000,49.000 220.091,45.036 223.909,45.036" fill="rgb(31,31,31)"/>
<rect x="15" y="49" width="414" height="34" rx="3" fill="rgb(242,242,242)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="222.000" y="63.375" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="184.000" lengthAdjust="spacingAndGlyphs">冻结候选宇宙、完整对象分、效用及资源配置</text>
<text x="222.000" y="75.875" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="189.130" lengthAdjust="spacingAndGlyphs">训练辅助头不参与推理；no-op独立保留当前图</text>
<polyline points="222.000,83.000 222.000,95.000" fill="none" stroke="rgb(31,31,31)" stroke-width="1"/>
<polygon points="222.000,95.000 220.091,91.036 223.909,91.036" fill="rgb(31,31,31)"/>
<rect x="34" y="95" width="380" height="34" rx="3" fill="rgb(237,237,237)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="224.000" y="109.375" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="161.517" lengthAdjust="spacingAndGlyphs">按当前状态枚举六类提议并轮转；批长6</text>
<text x="224.000" y="121.875" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="180.950" lengthAdjust="spacingAndGlyphs">每轮尝试32／接受3；每次评估保留失败成本</text>
<polyline points="222.000,129.000 222.000,141.000" fill="none" stroke="rgb(31,31,31)" stroke-width="1"/>
<polygon points="222.000,141.000 220.091,137.036 223.909,137.036" fill="rgb(31,31,31)"/>
<rect x="34" y="141" width="380" height="34" rx="3" fill="rgb(237,237,237)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="224.000" y="155.375" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="132.897" lengthAdjust="spacingAndGlyphs">算法4-2：冲突闭合与端点依赖域</text>
<text x="224.000" y="167.875" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="193.200" lengthAdjust="spacingAndGlyphs">失效已选外部槽位最小扩域；全部删增重新计费</text>
<polyline points="222.000,175.000 222.000,187.000" fill="none" stroke="rgb(31,31,31)" stroke-width="1"/>
<polygon points="222.000,187.000 220.091,183.036 223.909,183.036" fill="rgb(31,31,31)"/>
<rect x="34" y="187" width="380" height="34" rx="3" fill="rgb(237,237,237)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="224.000" y="201.375" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="194.256" lengthAdjust="spacingAndGlyphs">局部ILP；可行incumbent复核且保留非最优身份</text>
<text x="224.000" y="213.875" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="184.000" lengthAdjust="spacingAndGlyphs">整图合法、分项非降、严格总增益、剩余预算</text>
<polyline points="130.000,221.000 130.000,236.000" fill="none" stroke="rgb(31,31,31)" stroke-width="1"/>
<polygon points="130.000,236.000 128.091,232.036 131.909,232.036" fill="rgb(31,31,31)"/>
<polyline points="330.000,221.000 330.000,236.000" fill="none" stroke="rgb(31,31,31)" stroke-width="1" stroke-dasharray="3 2"/>
<polygon points="330.000,236.000 328.091,232.036 331.909,232.036" fill="rgb(31,31,31)"/>
<rect x="34" y="236" width="192" height="42" rx="3" fill="rgb(235,235,235)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="130.000" y="248.835" font-size="9.1" text-anchor="middle" fill="rgb(15,15,15)" textLength="81.900" lengthAdjust="spacingAndGlyphs">有合格项：整批择优</text>
<text x="130.000" y="260.335" font-size="9.1" text-anchor="middle" fill="rgb(15,15,15)" textLength="104.988" lengthAdjust="spacingAndGlyphs">总效用 → 少编辑 → 语义键</text>
<text x="130.000" y="271.835" font-size="9.1" text-anchor="middle" fill="rgb(15,15,15)" textLength="100.100" lengthAdjust="spacingAndGlyphs">原子提交；失败完整回退</text>
<rect x="245" y="236" width="169" height="42" rx="3" fill="rgb(255,255,255)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="329.500" y="248.835" font-size="9.0" text-anchor="middle" fill="rgb(15,15,15)" textLength="95.019" lengthAdjust="spacingAndGlyphs">本批无合格：保留no-op</text>
<text x="329.500" y="260.335" font-size="9.0" text-anchor="middle" fill="rgb(15,15,15)" textLength="108.000" lengthAdjust="spacingAndGlyphs">仍有余批且额度允许：继续</text>
<text x="329.500" y="271.835" font-size="9.0" text-anchor="middle" fill="rgb(15,15,15)" textLength="90.000" lengthAdjust="spacingAndGlyphs">队列或资源耗尽：停止</text>
<polyline points="34.000,258.000 20.000,258.000 20.000,112.000 34.000,112.000" fill="none" stroke="rgb(31,31,31)" stroke-width="1" stroke-dasharray="3 2"/>
<polygon points="34.000,112.000 30.036,113.909 30.036,110.091" fill="rgb(31,31,31)"/>
<text x="17.000" y="302.000" font-size="9.2" text-anchor="start" fill="rgb(15,15,15)" textLength="202.400" lengthAdjust="spacingAndGlyphs">提交后重建队列；空批仅推进游标；冻结评分不变</text>
<rect x="120" y="313" width="230" height="26" rx="3" fill="rgb(255,255,255)" stroke="rgb(56,56,56)" stroke-width="0.8"/>
<text x="235.000" y="329.625" font-size="9.2" text-anchor="middle" fill="rgb(15,15,15)" textLength="128.800" lengthAdjust="spacingAndGlyphs">返回最后完整合法图及停止原因</text>
<polyline points="330.000,278.000 330.000,313.000" fill="none" stroke="rgb(31,31,31)" stroke-width="1" stroke-dasharray="3 2"/>
<polygon points="330.000,313.000 328.091,309.036 331.909,309.036" fill="rgb(31,31,31)"/>
<polyline points="17.000,358.000 42.000,358.000" fill="none" stroke="rgb(31,31,31)" stroke-width="1"/>
<polygon points="42.000,358.000 38.036,359.909 38.036,356.091" fill="rgb(31,31,31)"/>
<text x="49.000" y="361.000" font-size="9" text-anchor="start" fill="rgb(15,15,15)" textLength="45.000" lengthAdjust="spacingAndGlyphs">数据／表示</text>
<polyline points="118.000,358.000 143.000,358.000" fill="none" stroke="rgb(31,31,31)" stroke-width="1" stroke-dasharray="3 2"/>
<polygon points="143.000,358.000 139.036,359.909 139.036,356.091" fill="rgb(31,31,31)"/>
<text x="150.000" y="361.000" font-size="9" text-anchor="start" fill="rgb(15,15,15)" textLength="45.000" lengthAdjust="spacingAndGlyphs">控制／调用</text>
<text x="429.039" y="361.000" font-size="9" text-anchor="end" fill="rgb(15,15,15)" textLength="63.000" lengthAdjust="spacingAndGlyphs">灰底：新增模块</text>
<text x="222.520" y="375.000" font-size="9" text-anchor="middle" fill="rgb(76,76,76)" textLength="135.000" lengthAdjust="spacingAndGlyphs">人为构造的机制示意；非实测结果</text>
</g></svg>
