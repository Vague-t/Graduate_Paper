   <g id="text_1">
    <text style="font-size: 9.3px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #2e7877" x="11.338583" y="17.447119" transform="rotate(-0 11.338583 17.447119)">原文固定，预测对象及其关系共同变化</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.6px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #253541" x="222.519685" y="51.212414" transform="rotate(-0 222.519685 51.212414)">“图书馆现有座位不足，而且开放时间偏短”</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.5px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #253541" transform="translate(74.180525 105.947497)">旧c2 · Premise</text>
    <text style="font-size: 8.5px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #253541" transform="translate(63.797244 116.662311)">图书馆现有座位不足</text>
    <text style="font-size: 8.5px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #253541" transform="translate(80.797244 126.590876)">（短跨度）</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.5px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #253541" transform="translate(315.125407 106.12613)">新c2 · Premise</text>
    <text style="font-size: 8.5px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #253541" transform="translate(300.492126 116.374108)">图书馆现有座位不足，</text>
    <text style="font-size: 8.5px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; fill: #253541" transform="translate(308.992126 127.159977)">而且开放时间偏短</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.1px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #2e7877" x="222.519685" y="102.293762" transform="rotate(-0 222.519685 102.293762)">替换</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #687781" x="222.519685" y="161.626814" transform="rotate(-0 222.519685 161.626814)">跨度不同即为不同对象；不按显示ID继承旧边</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.2px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #253541" x="222.519685" y="196.833744" transform="rotate(-0 222.519685 196.833744)">删除旧对象全部入边与出边；重判新对象的全部合法关系组合（含NONE）</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.1px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #253541" x="222.519685" y="250.894973" transform="rotate(-0 222.519685 250.894973)">固定域外关系并复核整图约束；失效已选槽位最小扩域且计费，仍失败则拒绝</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #253541" x="222.519685" y="304.761014" transform="rotate(-0 222.519685 304.761014)">接受门：组件与关系分项效用分别不降；总增益超过正阈值；整图合法且预算内</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #253541" x="110.551181" y="354.556688" transform="rotate(-0 110.551181 354.556688)">全部通过：组件与关系原子提交</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #253541" x="334.488189" y="354.291063" transform="rotate(-0 334.488189 354.291063)">任一失败：整体回退，保留原图</text>
   </g>
  </g>
 </g>
