[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-argument-repair"
version = "0.1.0"
description = "Native argument-graph augmentation, paired learning and dependency-closed repair"
requires-python = ">=3.11"
dependencies = ["torch==2.9.1", "transformers==4.57.6", "accelerate==1.11.0", "scipy==1.16.3", "numpy>=1.26,<2.6", "pyyaml==6.0.3"]

[project.optional-dependencies]
test = ["pytest==9.0.2"]
cuda = ["bitsandbytes==0.48.2"]

[project.scripts]
argrepair = "argrepair.cli:main"

[tool.setuptools.packages.find]
include = ["argrepair*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
