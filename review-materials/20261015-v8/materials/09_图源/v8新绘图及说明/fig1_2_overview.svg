<svg xmlns="http://www.w3.org/2000/svg" width="14.65cm" height="10.413855cm" viewBox="0 0 830 590">
<title>论文研究内容与章节逻辑</title>
<desc>第一章明确研究目标，第二章建立共同理论与表示，第三章和第四章分别研究增强监督的可靠学习与预测结构的联合修正，第五章总结研究结论。第三章所得模型可向第四章提供初始预测，第四章也可以独立使用基准模型。</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53697c"/></marker>
</defs>
<rect width="830" height="590" fill="#ffffff"/>

<rect x="25" y="14" width="780" height="68" rx="6" fill="#f1f5f8" stroke="#71869a" stroke-width="2"/>
<text x="415" y="41" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" text-anchor="middle" fill="#203246">第1章  研究目标与问题</text>
<text x="415" y="67" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" text-anchor="middle" fill="#203246">提高端到端论辩挖掘中组件与关系联合抽取的准确性</text>
<path d="M 415 83 L 415 103" fill="none" stroke="#53697c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="25" y="108" width="780" height="68" rx="6" fill="#f1f5f8" stroke="#71869a" stroke-width="2"/>
<text x="415" y="135" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" text-anchor="middle" fill="#203246">第2章  共同理论与任务表示</text>
<text x="415" y="161" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" text-anchor="middle" fill="#203246">论辩图表示 · 生成式抽取 · 一致性学习 · 结构化预测</text>
<path d="M 415 177 L 415 194 L 207.5 194 L 207.5 215" fill="none" stroke="#53697c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 415 194 L 622.5 194 L 622.5 215" fill="none" stroke="#53697c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="25" y="219" width="365" height="239" rx="6" fill="#f4f8fc" stroke="#47769b" stroke-width="2"/>
<rect x="440" y="219" width="365" height="239" rx="6" fill="#fff8ef" stroke="#b28345" stroke-width="2"/>
<path d="M 25 263 H 390" stroke="#a9bfd1" stroke-width="1.5"/>
<path d="M 440 263 H 805" stroke="#d8bd97" stroke-width="1.5"/>
<text x="207.5" y="248" font-family="Noto Sans CJK SC" font-size="21" font-weight="700" text-anchor="middle" fill="#203246">第3章  可靠监督与一致性学习</text>
<text x="622.5" y="248" font-family="Noto Sans CJK SC" font-size="21" font-weight="700" text-anchor="middle" fill="#203246">第4章  结构约束联合修正</text>
<text x="45" y="294" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" text-anchor="start" fill="#203246">输入：已标注文本及其改写</text>
<text x="45" y="362" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" text-anchor="start" fill="#203246">问题：改写后原监督可能失效</text>
<text x="45" y="412" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" text-anchor="start" fill="#203246">结果：训练后的抽取模型</text>
<text x="460" y="294" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" text-anchor="start" fill="#203246">输入：初始预测</text>
<text x="460" y="321" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" text-anchor="start" fill="#203246">（第3章模型或基准模型）</text>
<text x="460" y="362" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" text-anchor="start" fill="#203246">问题：组件与关系需协调修改</text>
<text x="460" y="412" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" text-anchor="start" fill="#203246">结果：修正后的完整论辩图</text>
<path d="M 390 412 L 415 412 L 415 294 L 437 294" fill="none" stroke="#53697c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<path d="M 207.5 459 L 207.5 482 L 415 482 L 415 501" fill="none" stroke="#53697c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 622.5 459 L 622.5 482 L 415 482" fill="none" stroke="#53697c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="25" y="506" width="780" height="68" rx="6" fill="#f1f5f8" stroke="#71869a" stroke-width="2"/>
<text x="415" y="534" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" text-anchor="middle" fill="#203246">第5章  总结与展望</text>
<text x="415" y="560" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" text-anchor="middle" fill="#203246">归纳研究结论，分析方法局限，讨论后续研究方向</text>
</svg>