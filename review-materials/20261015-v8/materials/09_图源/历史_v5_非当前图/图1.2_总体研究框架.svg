<text x="480.0" y="494.45" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="27" fill="#1a2c40" font-weight="normal">界定改写的关系影响域</text>
<rect x="170" y="570" width="620" height="90" rx="9" fill="#f1f7fb" stroke="#467da5" stroke-width="2"/>
<text x="480.0" y="624.45" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="27" fill="#1a2c40" font-weight="normal">迁移标注并逐项审核语义</text>
<rect x="170" y="700" width="620" height="90" rx="9" fill="#f1f7fb" stroke="#467da5" stroke-width="2"/>
<text x="480.0" y="754.45" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="27" fill="#1a2c40" font-weight="normal">可靠因素监督与一致性约束</text>
