<svg xmlns="http://www.w3.org/2000/svg" width="1566" height="1004" viewBox="0 0 1566 1004"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#35536c"/></marker></defs>
<text x="783" y="55.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="37" fill="#1a2c40" font-weight="bold">端到端论辩挖掘的总体研究框架</text>
<rect x="170" y="85" width="1350" height="92" rx="9" fill="#edf2f7" stroke="#526f89" stroke-width="2"/>
<text x="845.0" y="141.5" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="30" fill="#1a2c40" font-weight="normal">研究目标：联合识别论辩组件与关系，提高预测结构的可靠性</text>
<text x="85" y="142.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="29" fill="#1a2c40" font-weight="bold">目标</text>
