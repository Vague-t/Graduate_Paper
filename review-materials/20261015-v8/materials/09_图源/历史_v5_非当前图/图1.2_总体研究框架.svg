<rect x="900" y="570" width="620" height="90" rx="9" fill="#fff9f0" stroke="#b5813d" stroke-width="2"/>
<text x="1210.0" y="624.45" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="27" fill="#1a2c40" font-weight="normal">组件修改与受影响关系共同决策</text>
