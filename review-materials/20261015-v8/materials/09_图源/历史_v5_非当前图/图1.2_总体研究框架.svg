<path d="M1210,660 L1210,700" fill="none" stroke="#35536c" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1210,400 L1210,440" fill="none" stroke="#35536c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="85" y="887.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="29" fill="#1a2c40" font-weight="bold">结果</text>
