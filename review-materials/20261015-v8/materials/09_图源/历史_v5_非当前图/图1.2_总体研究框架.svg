<text x="1210.0" y="247.15" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="29" fill="#1a2c40" font-weight="normal">第4章　结构约束联合修正</text>
<text x="85" y="337.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="29" fill="#1a2c40" font-weight="bold">问题</text>
