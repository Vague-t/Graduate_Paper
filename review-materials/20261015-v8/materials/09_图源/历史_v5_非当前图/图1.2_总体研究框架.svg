<text x="480.0" y="337.375" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="27" fill="#1a2c40" font-weight="normal">局部改写可能改变组件类型与关系，</text>
<text x="480.0" y="376.525" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="27" fill="#1a2c40" font-weight="normal">直接继承原标注会引入错误监督</text>
<rect x="900" y="295" width="620" height="105" rx="9" fill="#fff9f0" stroke="#b5813d" stroke-width="2"/>
<text x="1210.0" y="337.375" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="27" fill="#1a2c40" font-weight="normal">预测组件的边界或类型发生变化后，</text>
<text x="1210.0" y="376.525" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="27" fill="#1a2c40" font-weight="normal">相关关系需要重新判断</text>
<text x="85" y="620.0" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="29" fill="#1a2c40" font-weight="bold">方法</text>
